[package]
name = "ftf2ttf"
version = "0.1.0"
edition = "2024"
authors = ["H3CoF6"]
description = "High-performance Tencent FTF font to standard TTF converter"

[lib]
name = "ftf2ttf"
path = "src/lib.rs"

[[bin]]
name = "ftf2ttf"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
rayon = "1.8"
anyhow = "1.0"
walkdir = "2.4"

[dev-dependencies]
reqwest = { version = "0.11", features = ["blocking"] }
zip = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"